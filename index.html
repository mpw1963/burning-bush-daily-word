<style>
:root{--ivory:#fbf7ed;--paper:#fffdf7;--ink:#30251c;--muted:#766657;--gold:#b6812f;--amber:#d97722;--line:#e8dcc6;--green:#526341}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#f4dfb9,transparent 48%),var(--ivory);color:var(--ink);font:16px/1.65 Georgia,'Times New Roman',serif}.wrap{max-width:960px;margin:auto;padding:28px 20px 64px}.brand{text-align:center;padding:20px 0 16px}.mark{font-size:2rem;color:var(--amber)}.eyebrow{letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font:600 .74rem/1.5 system-ui,sans-serif}.brand h1{font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.05;margin:8px 0;color:#49331c}.brand p{margin:10px 0;color:var(--muted);font-style:italic}.today{text-align:center;color:var(--muted);font: .92rem system-ui,sans-serif;margin:16px 0 25px}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 auto 20px}.tabs button,.action,.small-btn{border:1px solid var(--line);border-radius:999px;padding:10px 17px;background:#fffaf0;color:#61451f;font:600 .9rem system-ui,sans-serif;cursor:pointer}.tabs button[aria-selected=true]{background:#80581f;color:white;border-color:#80581f}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 36px #68491a0b}.card+.card{margin-top:18px}.label{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font:700 .72rem system-ui,sans-serif}.card h2{font-size:clamp(1.7rem,4vw,2.35rem);line-height:1.16;margin:8px 0 5px;color:#49331c}.ref{color:var(--muted);font-style:italic;margin:0 0 20px}.verse{font-size:1.15rem;line-height:1.8;padding:17px 20px;border-left:3px solid var(--amber);background:#fcf5e8;border-radius:0 10px 10px 0}.verse cite{display:block;margin-top:8px;color:var(--muted);font-size:.9rem}.note{color:var(--muted);font: .82rem/1.5 system-ui,sans-serif}.rule{height:1px;background:var(--line);margin:24px 0}.card h3{font-size:1.15rem;margin:21px 0 7px;color:#684b23}.card ul{padding-left:22px}.card li{padding-left:4px;margin:8px 0}.question{padding:16px 18px;background:#f8f0df;border-radius:12px;font-style:italic}.prayer{color:#564532}.action{background:var(--green);border-color:var(--green);color:#fff}.action:hover{filter:brightness(1.07)}.action:disabled{background:#77816c;cursor:default}.progress-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.progress-track{height:9px;background:#eee5d5;border-radius:99px;overflow:hidden;margin:12px 0 5px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--amber));width:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit;color:var(--ink)}.history{max-height:255px;overflow:auto;padding-right:4px}.chapter-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px;padding:9px 2px}.chapter-row:last-child{border:0}.chapter-row small{color:var(--muted);display:block}.small-btn{font-size:.78rem;padding:6px 12px}.small-btn.done{background:#edf0e8;color:var(--green)}.notice{font: .86rem/1.6 system-ui,sans-serif;color:var(--muted);background:#f7f1e6;border-radius:10px;padding:13px 15px}.foot{text-align:center;margin-top:26px;color:var(--muted);font-size:.84rem}.foot strong{color:#684b23}.hidden{display:none!important}button:focus-visible,select:focus-visible{outline:3px solid #dc9a4b;outline-offset:3px}@media(max-width:560px){.wrap{padding:15px 12px 44px}.tabs button{padding:9px 13px;font-size:.82rem}.card{border-radius:14px}}

<body><main class="wrap"><header class="brand"><div class="mark" aria-hidden="true">✦</div><div class="eyebrow">The Burning Bush</div><h1>Bible Study</h1><p>The Word first. Christ at the center. Hope for every life.</p></header><div class="today" id="today"></div>
<nav class="tabs" aria-label="Bible study sections"><button data-tab="study" aria-selected="true">Bible Study</button><button data-tab="chapter" aria-selected="false">One Chapter a Day</button><button data-tab="progress" aria-selected="false">My Reading Journey</button></nav>
<section id="study" class="panel card"></section><section id="chapter" class="panel card hidden"></section><section id="progress" class="panel card hidden"></section>
<footer class="foot"><strong>One Chapter a Day Keeps the Adversary Away!</strong><br>The Word of God is living and enduring. May every reading point us to Jesus Christ.</footer></main>
<script>
const books=[['Genesis',50],['Exodus',40],['Leviticus',27],['Numbers',36],['Deuteronomy',34],['Joshua',24],['Judges',21],['Ruth',4],['1 Samuel',31],['2 Samuel',24],['1 Kings',22],['2 Kings',25],['1 Chronicles',29],['2 Chronicles',36],['Ezra',10],['Nehemiah',13],['Esther',10],['Job',42],['Psalms',150],['Proverbs',31],['Ecclesiastes',12],['Song of Solomon',8],['Isaiah',66],['Jeremiah',52],['Lamentations',5],['Ezekiel',48],['Daniel',12],['Hosea',14],['Joel',3],['Amos',9],['Obadiah',1],['Jonah',4],['Micah',7],['Nahum',3],['Habakkuk',3],['Zephaniah',3],['Haggai',2],['Zechariah',14],['Malachi',4],['Matthew',28],['Mark',16],['Luke',24],['John',21],['Acts',28],['Romans',16],['1 Corinthians',16],['2 Corinthians',13],['Galatians',6],['Ephesians',6],['Philippians',4],['Colossians',4],['1 Thessalonians',5],['2 Thessalonians',3],['1 Timothy',6],['2 Timothy',4],['Titus',3],['Philemon',1],['Hebrews',13],['James',5],['1 Peter',5],['2 Peter',3],['1 John',5],['2 John',1],['3 John',1],['Jude',1],['Revelation',22]];
const chapters=[];for(const [book,n] of books)for(let c=1;c<=n;c++)chapters.push(`${book} ${c}`);
const content=[
{ref:'Genesis 1:1',verse:'In the beginning God created the heaven and the earth.',title:'In the Beginning, God',dev:'Every new beginning rests on the same truth: God is already there. Bring Him the unfinished parts of your life and trust His wise, creative care.',dq:'What part of your life needs to be placed again in the Creator’s hands?',pr:'Creator God, order my heart and help me see Your goodness in the world You made. Keep my eyes on Jesus, through whom all things hold together. Amen.',ex:'Genesis opens with God creating by His word. Creation is purposeful, good, and entrusted to human care; life begins with God, not with us.',lessons:['God is sovereign over every beginning.','Creation has God-given dignity and purpose.','We are stewards, called to care for what God made.'],q:'Where can you reflect God’s care in the way you treat someone or something today? '},
{ref:'Genesis 2:7',verse:'And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.',title:'Breath of Life',dev:'Your life is received, not self-made. This frees you from proving your worth and invites gratitude for the ordinary breath and work of today.',dq:'What ordinary gift can you receive with gratitude today?',pr:'Lord, thank You for the life You give. Teach me to live this day with humility, gratitude, and love. Amen.',ex:'The creation account draws close to humanity: God forms, gives breath, and places people in a garden with meaningful work and relationship.',lessons:['Human life is a gift from God.','Work and rest belong within God’s good design.','People are made for relationship with God and one another.'],q:'How might gratitude change the way you approach today’s work? '},
{ref:'Genesis 3:9',verse:'And the LORD God called unto Adam, and said unto him, Where art thou?',title:'God Seeks the Hiding',dev:'When shame urges you to hide, remember that God calls people back into the light. In Christ, confession can begin a path toward forgiveness and restoration.',dq:'Where are you tempted to hide instead of honestly seeking God?',pr:'Merciful God, meet me in my hiding places. Give me courage to tell the truth and receive the grace You offer in Christ. Amen.',ex:'Genesis 3 tells of humanity’s disobedience and its fracture of trust. God judges evil, yet seeks the people who hide and promises that evil will not have the last word.',lessons:['Sin damages our relationship with God and neighbor.','God sees us even when we hide.','God’s promise gives hope beyond judgment.'],q:'What honest step toward God or another person can you take? '},
{ref:'Genesis 6:8',verse:'But Noah found grace in the eyes of the LORD.',title:'Grace in a Troubled World',dev:'Faithfulness can feel lonely when the surrounding culture is harsh. Noah’s story reminds us that grace begins with God and sustains a life of obedience.',dq:'What is one small act of faithfulness you can practice today?',pr:'God of grace, steady me when the world feels unsettled. Help me obey You with quiet courage and trust Your care. Amen.',ex:'As violence spreads, God calls Noah to build the ark. The flood is a sobering account of judgment, but God preserves life and establishes a covenant.',lessons:['God takes evil seriously.','Grace sustains those who trust God.','God’s covenant points toward His faithful care for life.'],q:'Where do you need to trust God through a long, ordinary act of obedience? '},
{ref:'Genesis 12:2',verse:'And I will make of thee a great nation, and I will bless thee, and make thy name great; and thou shalt be a blessing.',title:'Blessed to Be a Blessing',dev:'God’s blessings are not meant to stop with us. Ask how the encouragement, resources, or mercy you have received can become a gift to someone else.',dq:'Who could be strengthened by a kindness you offer today?',pr:'Faithful God, thank You for Your promises. Make me a channel of Your kindness and help me trust You on the road ahead. Amen.',ex:'God calls Abram to leave familiar ground and promises to make him a blessing to the families of the earth. The story begins a covenant journey that leads toward Christ.',lessons:['God calls people to trust and follow.','God’s blessing carries responsibility toward others.','God’s promise reaches beyond one family to all nations.'],q:'What can you share today that would bless another person? '},
{ref:'Genesis 15:6',verse:'And he believed in the LORD; and he counted it to him for righteousness.',title:'Trusting the Promise',dev:'Waiting does not mean God has forgotten. Abraham’s story makes room for honest questions while inviting us to keep trusting the One who speaks promises.',dq:'What promise or hope are you finding difficult to wait for?',pr:'God who keeps covenant, strengthen my trust while I wait. Help me rest in Your grace and follow Jesus faithfully today. Amen.',ex:'God reassures Abram with a covenant promise. Abram believes, though the fulfillment will take time; Scripture emphasizes trust in God’s faithfulness.',lessons:['Faith rests on God’s character.','It is honest to bring questions to God.','God’s timing may stretch beyond our preferred schedule.'],q:'How can you practice patient trust in one situation this week? '},
{ref:'Genesis 22:14',verse:'And Abraham called the name of that place Jehovah-jireh: as it is said to this day, In the mount of the LORD it shall be seen.',title:'The Lord Will Provide',dev:'Provision may not arrive in the form or timing we expect. Abraham’s account calls us to trust God while treating the story’s difficult details with reverence and care.',dq:'Where do you need help trusting God with an uncertain outcome?',pr:'Provider and Lord, meet me in uncertainty. Give me wisdom, compassion, and a deeper trust in Your care. Amen.',ex:'God tests Abraham’s trust and provides a ram. The passage is difficult and should not be used to excuse harm; it ultimately shows God providing and reaffirming His covenant.',lessons:['God’s provision is an act of grace.','Trust does not make human life expendable.','God’s covenant purposes continue through uncertainty.'],q:'What wise, safe step can you take while entrusting the outcome to God? '},
{ref:'Genesis 28:15',verse:'And, behold, I am with thee, and will keep thee in all places whither thou goest...',title:'God Is With You',dev:'Jacob is far from home and unsure of the future, yet God meets him there. You can pray honestly in an unfamiliar season and take the next faithful step.',dq:'What unfamiliar situation would you like to invite God into?',pr:'God who stays near, be with me in the places I cannot yet understand. Guide my next step and keep my hope in Christ. Amen.',ex:'Jacob dreams of a connection between heaven and earth and hears God reaffirm the covenant. God’s presence accompanies him on the journey.',lessons:['God can meet us in unsettled seasons.','God’s promises are grounded in His faithfulness.','Worship can begin in an unexpected place.'],q:'What would it look like to mark this place in life with gratitude or prayer? '},
{ref:'Genesis 32:28',verse:'...for as a prince hast thou power with God and with men, and hast prevailed.',title:'Wrestling Through the Night',dev:'Some nights bring hard questions rather than quick answers. Jacob’s encounter encourages perseverance and honest dependence on God, even when we leave changed.',dq:'What question can you bring honestly to God in prayer?',pr:'Lord, meet me in the struggle. Keep me near You, shape my character, and help me receive the help I need. Amen.',ex:'On the eve of meeting Esau, Jacob wrestles through the night and receives a new name. The encounter marks a life being changed through dependence on God.',lessons:['God welcomes honest dependence.','Encounter can change how we understand ourselves.','Reconciliation may require courage and humility.'],q:'Is there a relationship where a humble first step toward peace is possible? '},
{ref:'Genesis 50:20',verse:'...ye thought evil against me; but God meant it unto good...',title:'God Can Bring Good',dev:'Joseph does not call the harm done to him good. He recognizes that God can work for good even through human wrongdoing, and chooses mercy over revenge.',dq:'What boundary or act of mercy would help you respond to hurt wisely?',pr:'God of justice and mercy, comfort those who have been harmed. Give me wisdom to seek safety, healing, and forgiveness without denying the truth. Amen.',ex:'Joseph forgives his brothers while naming the evil they intended. God preserves many lives through the family’s story, without excusing the brothers’ actions.',lessons:['Naming harm honestly matters.','God can bring life from painful circumstances.','Forgiveness and wise boundaries can coexist.'],q:'What support would help you move toward healing without minimizing harm? '},
{ref:'Exodus 3:14',verse:'And God said unto Moses, I AM THAT I AM...',title:'The God Who Is',dev:'Moses feels inadequate for the work ahead. God answers first with His own presence. When you feel unready, begin with who God is and take one obedient step.',dq:'What task feels too large, and what is one manageable next step?',pr:'I AM, be near to me. Quiet my fear, guide my words, and help me act with courage and compassion. Amen.',ex:'God hears the suffering of Israel and calls Moses to lead their deliverance. God’s name expresses His living presence and faithfulness.',lessons:['God hears the cries of the oppressed.','God calls and accompanies imperfect people.','Deliverance is rooted in God’s character.'],q:'How can you respond to someone’s need in a practical way? '},
{ref:'Exodus 12:13',verse:'...when I see the blood, I will pass over you, and the plague shall not be upon you to destroy you...',title:'Remember the Deliverance',dev:'Israel’s Passover meal teaches a people to remember rescue and tell the next generation. Christians see the Passover as part of the Bible’s story leading to Jesus, the Lamb of God.',dq:'What act of God’s faithfulness do you need to remember today?',pr:'God of deliverance, keep the story of Your mercy alive in me. Thank You for Jesus and the hope of redemption. Amen.',ex:'On the night of Israel’s release from Egypt, the Passover becomes a lasting remembrance of God’s deliverance and covenant care.',lessons:['Remembering God’s rescue shapes identity.','Freedom invites worship and service.','God’s saving story leads Christians to Christ.'],q:'What simple practice could help you remember God’s faithfulness this week? '},
{ref:'Exodus 14:14',verse:'The LORD shall fight for you, and ye shall hold your peace.',title:'Stand Still and Trust',dev:'At the sea, Israel faces fear and no visible way forward. Stillness here is not apathy: it is trust that makes room to follow God’s direction when it comes.',dq:'Where could a pause help you respond instead of react?',pr:'God, steady my heart in fear. Show me the next step and help me trust You while I take it. Amen.',ex:'God leads Israel through the sea and frees them from Pharaoh’s pursuing army. The rescue becomes a defining memory of God’s power and care.',lessons:['Fear is real, but it need not rule us.','God makes a way where people see none.','Deliverance leads to praise and trust.'],q:'What is the next faithful action you can take after pausing to pray? '},
{ref:'Exodus 20:3',verse:'Thou shalt have no other gods before me.',title:'First Things First',dev:'The commandments begin by ordering worship. Notice what receives your deepest trust, time, and attention; ask God to restore the right center.',dq:'What habit could help you put love of God ahead of distraction?',pr:'Lord, be first in my heart. Free me from whatever takes Your place and teach me to love You and my neighbor. Amen.',ex:'God gives Israel covenant commands after delivering them from Egypt. The law describes a life shaped by worship, justice, and care for neighbor.',lessons:['Grace precedes the covenant commands.','Worship shapes daily choices.','Love for God and neighbor belongs together.'],q:'Which command helps guide a decision you face today? '},
{ref:'Leviticus 19:18',verse:'...thou shalt love thy neighbour as thyself: I am the LORD.',title:'Love Your Neighbor',dev:'Holiness becomes visible in how we treat people. Loving a neighbor can mean patience, fairness, generosity, listening, or protecting someone vulnerable.',dq:'Who is your neighbor in need of patience or practical help today?',pr:'Holy God, teach me to love in ways people can feel. Make me fair, patient, and generous for the sake of Christ. Amen.',ex:'Leviticus gathers Israel’s worship and community laws. This command makes love of neighbor central to a holy life.',lessons:['Faith shapes public and private behavior.','Love includes fairness and protection for the vulnerable.','Holiness is lived in ordinary relationships.'],q:'What specific act of neighbor-love will you choose today? '},
{ref:'Numbers 6:24',verse:'The LORD bless thee, and keep thee:',title:'A Blessing to Carry',dev:'Receive this blessing slowly. God’s keeping is not a promise of an easy life, but an assurance that you are seen and held as you walk with Him.',dq:'Who could use a spoken word of encouragement today?',pr:'Lord, bless and keep those I love. Let Your peace guard us, and make us a blessing to others. Amen.',ex:'The priestly blessing asks God to protect, show favor, and give peace to Israel. It places the community under God’s gracious name.',lessons:['Blessing begins with God’s favor.','Peace is a gift to receive and share.','Words of blessing can strengthen a community.'],q:'Whom can you bless with a sincere message today? '},
{ref:'Deuteronomy 6:5',verse:'And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might.',title:'Love God Wholeheartedly',dev:'Love for God includes the whole of life: attention, energy, decisions, and relationships. Small repeated practices help faith take root in a busy day.',dq:'What small daily rhythm could help you remember God’s love?',pr:'God, gather my scattered attention. Help me love You with my choices and teach my household to remember Your goodness. Amen.',ex:'Moses urges Israel to remember God’s commands and teach them at home and along the way. Faith is woven into ordinary life.',lessons:['Love for God engages the whole person.','Remembering helps faith endure.','Teaching faith can happen in ordinary moments.'],q:'What moment in your day could become a regular moment of prayer? '},
{ref:'Joshua 1:9',verse:'Be strong and of a good courage; be not afraid...for the LORD thy God is with thee whithersoever thou goest.',title:'Courage for the Next Step',dev:'Courage is not the absence of fear. Joshua is told to be strong because God is present and because the people have a path to follow.',dq:'What next step would you take if you trusted you were not alone?',pr:'God, give me courage grounded in Your presence. Keep me faithful, humble, and attentive to Your word. Amen.',ex:'Joshua takes up leadership after Moses. God calls him to courage, attention to the law, and trust in God’s presence.',lessons:['Leadership is strengthened by God’s presence.','Courage grows through attention to God’s word.','Faithfulness is practiced one step at a time.'],q:'What practical preparation can support the courageous step you need to take? '},
{ref:'Ruth 1:16',verse:'...thy people shall be my people, and thy God my God:',title:'Faithful Love',dev:'Ruth’s loyalty to Naomi is costly, practical love. God often works through people who stay near, listen, and help with the next need.',dq:'Who needs your steady presence more than advice today?',pr:'God of steadfast love, make me faithful in the commitments You have given me. Help me accompany others with kindness. Amen.',ex:'Ruth leaves Moab with Naomi and joins Israel’s community. Her loyalty becomes part of a story of provision and the family line of David.',lessons:['Loyalty can be a courageous choice.','God works through ordinary acts of care.','Welcoming outsiders reflects covenant kindness.'],q:'What is one concrete way to stand with someone this week? '},
{ref:'1 Samuel 16:7',verse:'...man looketh on the outward appearance, but the LORD looketh on the heart.',title:'The Heart God Sees',dev:'People are often judged by what is visible. God sees deeper. Ask for a heart shaped by humility and love, and practice looking beyond appearances in others.',dq:'Whom might you understand better if you looked beyond first impressions?',pr:'God, search my heart and make it true. Help me see people with compassion and honor the work You are doing within them. Amen.',ex:'Samuel is sent to anoint a new king. God directs him past outward appearance to David, the youngest son, reminding Israel that God’s judgment differs from human assumptions.',lessons:['Appearances do not reveal the whole person.','God’s calling may surprise us.','A faithful heart matters more than status.'],q:'What assumption about someone could you replace with a curious question? '},
{ref:'2 Samuel 7:16',verse:'...thy throne shall be established for ever.',title:'A Promise Beyond David',dev:'God’s promise to David becomes part of Israel’s hope for a righteous king. Christians see that hope fulfilled in Jesus, whose kingdom is marked by justice and peace.',dq:'Where do you long to see just and compassionate leadership?',pr:'King of all, guide those who lead. Keep my hope in Jesus and help me practice justice and mercy where I have influence. Amen.',ex:'God makes a covenant promise to David and his house. The promise shapes the biblical expectation of a coming king and points toward Christ.',lessons:['God’s purposes reach beyond one generation.','Leadership is accountable to God.','The hope of Scripture centers on God’s promised King.'],q:'How can you practice servant-hearted leadership in your own sphere? '},
{ref:'1 Kings 3:9',verse:'Give therefore thy servant an understanding heart to judge thy people...',title:'Ask for Wisdom',dev:'Solomon asks for an understanding heart to serve others well. Wisdom begins when we admit our limits and seek God’s guidance for the good of those affected.',dq:'What decision needs listening and wisdom more than speed?',pr:'God of wisdom, teach me to listen well and choose what is just. Help my decisions serve others with humility. Amen.',ex:'At the start of his reign, Solomon asks for wisdom to govern. God grants wisdom, though the rest of the book also shows the danger of turning away.',lessons:['Wisdom is for serving, not self-display.','Listening is part of wise judgment.','Gifts need faithful stewardship.'],q:'Whose perspective should you hear before making a decision? '},
{ref:'Psalm 23:1',verse:'The LORD is my shepherd; I shall not want.',title:'The Shepherd’s Care',dev:'The shepherd image holds both guidance and protection. You can name your needs honestly and trust God to lead you through green pastures and difficult valleys alike.',dq:'Where do you need guidance, rest, or reassurance today?',pr:'Good Shepherd, lead me in right paths. Restore my soul and help me trust Your presence through every valley. Amen.',ex:'David’s beloved psalm describes God as shepherd, host, and protector. Its confidence is in God’s presence through both provision and danger.',lessons:['God guides and cares for His people.','Rest and nourishment are gifts.','God’s presence remains through dark valleys.'],q:'What would receiving rest as a gift look like for you today? '},
{ref:'Psalm 46:1',verse:'God is our refuge and strength, a very present help in trouble.',title:'A Present Help',dev:'This psalm does not deny upheaval; it names God as refuge in its midst. When trouble rises, seek safe support and let prayer steady you for the next step.',dq:'What support can you reach for instead of carrying trouble alone?',pr:'God our refuge, be near to all who are afraid or grieving. Give strength for today and peace for the next step. Amen.',ex:'The psalm pictures the earth shaking while God remains a refuge. The community is called to stillness and trust in God’s sovereignty.',lessons:['Faith can name danger honestly.','God is a refuge amid upheaval.','Stillness can renew perspective and trust.'],q:'Take one quiet minute: what do you need to entrust to God? '},
{ref:'Psalm 119:105',verse:'Thy word is a lamp unto my feet, and a light unto my path.',title:'Light for the Next Step',dev:'A lamp usually lights enough for the next few steps, not the entire road. Scripture can guide today’s choice while you trust God with what you cannot yet see.',dq:'What decision could be clarified by a principle from Scripture?',pr:'Lord, let Your word guide my steps. Give me understanding and help me put what I read into practice. Amen.',ex:'Psalm 119 celebrates God’s instruction as a source of life, wisdom, and direction for a faithful walk.',lessons:['Scripture guides practical choices.','Understanding grows through meditation and practice.','Faithfulness is a daily walk.'],q:'What is one action you can take in response to today’s reading? '},
{ref:'Proverbs 3:5',verse:'Trust in the LORD with all thine heart; and lean not unto thine own understanding.',title:'Trust Beyond Your View',dev:'Trust does not forbid careful thought; it reminds us that our view is partial. Seek wise counsel, pray, and let humility shape your choices.',dq:'Where might you need counsel from a wise and trustworthy person?',pr:'God, direct my path. Keep me humble enough to listen and courageous enough to follow what is good. Amen.',ex:'Proverbs teaches wisdom for everyday life. This passage joins trust in God with humility and practical acknowledgment of God in our paths.',lessons:['Our understanding is limited.','Wise trust includes humility and counsel.','Small choices shape the path we walk.'],q:'Who is one person you can ask for thoughtful counsel? '},
{ref:'Isaiah 40:31',verse:'But they that wait upon the LORD shall renew their strength...',title:'Strength for the Weary',dev:'Waiting on God is active hope, not a demand to pretend you are fine. Receive rest, ask for help, and take the next step at a sustainable pace.',dq:'What kind of rest or help would renew you right now?',pr:'Everlasting God, renew the weary. Teach me to wait with hope and to care wisely for the body and people You have given me. Amen.',ex:'Isaiah speaks comfort to a weary people in exile, proclaiming that the Creator neither faints nor forgets those who hope in Him.',lessons:['God’s strength does not run out.','Weariness can be met with comfort and renewal.','Hope gives endurance for the journey.'],q:'What boundary could protect the rest you need? '},
{ref:'Micah 6:8',verse:'...what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?',title:'A Faith You Can See',dev:'Micah gathers faithful living into justice, mercy, and humility. These are not abstract ideals: they shape how we use power, treat neighbors, and listen to God.',dq:'Which of justice, mercy, or humility needs your attention today?',pr:'God, make my faith visible in compassion and fairness. Keep me humble as I walk with You and follow Jesus. Amen.',ex:'The prophet challenges empty religious performance and calls God’s people to a life of justice, mercy, and humble fellowship with God.',lessons:['Worship and ethical living belong together.','Justice protects neighbors and communities.','Humility keeps service centered on God.'],q:'What specific choice today can embody justice or mercy? '},
{ref:'Matthew 5:16',verse:'Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.',title:'Let Your Light Shine',dev:'Jesus calls disciples to visible goodness that points beyond themselves to God. A patient word, honest work, or generous act can make faith tangible.',dq:'What good work could quietly point someone toward God’s kindness?',pr:'Jesus, make my life a light that serves rather than seeks attention. Let my actions honor the Father. Amen.',ex:'In the Sermon on the Mount, Jesus describes disciples as salt and light. Their public lives should reflect the goodness of the Father.',lessons:['Discipleship is visible in daily conduct.','Good works serve others and glorify God.','Light is meant to be shared.'],q:'What practical good can you do for someone today? '},
{ref:'John 3:16',verse:'For God so loved the world, that he gave his only begotten Son...',title:'Loved and Given',dev:'The heart of the gospel is God’s love, offered in Jesus. Receive that gift with trust, and let it move you toward love for people God loves.',dq:'How could remembering God’s love change your response to someone today?',pr:'Father, thank You for the gift of Your Son. Deepen my trust in Jesus and make me generous with the love I have received. Amen.',ex:'Jesus speaks with Nicodemus about new birth and God’s saving mission. The verse summarizes the gospel: God gives the Son so the world may have life.',lessons:['God’s love reaches the world.','Jesus is God’s gift and the way to life.','Belief invites a transformed life.'],q:'Who might need to experience patient, generous love through you? '},
{ref:'Romans 8:1',verse:'There is therefore now no condemnation to them which are in Christ Jesus...',title:'No Condemnation in Christ',dev:'In Christ, guilt need not be your identity. Receive forgiveness, make amends where needed, and walk by the Spirit in the freedom God gives.',dq:'What burden of shame do you need to bring honestly to God?',pr:'God of mercy, thank You for life in Christ. Help me receive forgiveness, repair what I can, and walk in Your Spirit. Amen.',ex:'Paul explains life in the Spirit and the assurance believers have in Christ. Grace frees people from condemnation and leads them toward new life.',lessons:['Our standing rests in Christ.','Grace makes honest change possible.','The Spirit leads believers into life and peace.'],q:'Is there a responsible step of repair or reconciliation you can take? '},
{ref:'Ephesians 2:8',verse:'For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:',title:'Grace Is a Gift',dev:'You do not have to earn God’s love. Grace releases you from performance and equips you for the good works prepared for a life of gratitude.',dq:'What would you do differently today if you began from grace rather than pressure?',pr:'God of grace, thank You for salvation as Your gift. Shape my life into one of gratitude, service, and hope in Christ. Amen.',ex:'Paul says salvation is God’s gift, not human achievement, and immediately connects grace with a life of good works.',lessons:['Salvation begins in God’s grace.','Faith receives what cannot be earned.','Good works are the fruit of grace, not its price.'],q:'What act of service can flow from gratitude rather than a need to prove yourself? '},
{ref:'Philippians 4:6',verse:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.',title:'Bring Every Concern',dev:'Paul invites anxious people to bring specific needs to God with thanksgiving. Prayer can accompany practical care, wise counsel, and seeking help when anxiety is heavy.',dq:'What concern can you name plainly in prayer today?',pr:'God of peace, receive my worries and those of everyone carrying a heavy load. Guide us to wise help and guard our hearts in Christ. Amen.',ex:'Writing from prison, Paul encourages prayer, gratitude, and attention to what is true and worthy. God’s peace guards believers in Christ.',lessons:['Prayer gives concerns a place to go.','Gratitude can coexist with hardship.','Peace is God’s gift amid circumstances.'],q:'Name one concern and one thing you can thank God for in the same prayer. '},
{ref:'Revelation 22:20',verse:'Surely I come quickly. Amen. Even so, come, Lord Jesus.',title:'Hope and Watchfulness',dev:'The Bible closes with longing for Christ’s return and the renewal of all things. Christian hope gives courage to serve faithfully while we wait.',dq:'How can future hope shape one loving action you take today?',pr:'Lord Jesus, come. Keep Your people hopeful, faithful, and compassionate as we wait for Your promised renewal. Amen.',ex:'Revelation ends with a vision of God dwelling with His people and a prayer for Jesus to come. The final word is hope, invitation, and grace.',lessons:['Christians wait with hope and faithfulness.','God promises the renewal of creation.','The story ends with grace and invitation.'],q:'What is one way to practice hope through service today? '}
];
const studies=[
{title:'Jesus, the Good Shepherd',ref:'John 10:1–18',context:'Jesus uses the shepherd image to show His care, authority, and self-giving love. Read the whole passage and notice the contrast between the shepherd who protects and the thief who harms.',questions:['What does Jesus say the shepherd does for the sheep?','What might it mean to recognize Jesus’ voice amid competing voices?','How can your community care for someone who feels overlooked?'],prayer:'Jesus, Good Shepherd, help me hear Your voice and follow You. Teach me to care for others with the same sacrificial love You show. Amen.'},
{title:'Grace That Makes Us New',ref:'Ephesians 2:1–10',context:'Paul describes salvation as God’s gift of grace and connects that gift to a life of good works. Read the passage as one movement: from death, to life with Christ, to a purposeful walk.',questions:['Which words describe what God does in this passage?','How does grace change the way you think about earning approval?','What good work might be a response to grace this week?'],prayer:'God of mercy, thank You for making us alive with Christ. Free me from striving for approval and lead me into the good You have prepared. Amen.'},
{title:'Practicing Justice and Mercy',ref:'Micah 6:6–8',context:'Micah challenges the idea that religious offerings can replace faithful living. The prophet calls God’s people to justice, covenant love, and humble fellowship with God.',questions:['What does Micah say God desires?','Where do you see a practical need for justice or mercy around you?','What could walking humbly with God look like in a disagreement?'],prayer:'Lord, make my worship sincere in the way I treat people. Give me courage to do justice, delight in mercy, and walk humbly with You. Amen.'},
{title:'Hope in the Resurrection',ref:'1 Corinthians 15:12–26, 50–58',context:'Paul explains why Jesus’ resurrection is central to Christian hope. Read both sections and notice how the promise of resurrection shapes present-day steadfastness and service.',questions:['Why does Paul insist that Christ has been raised?','How does resurrection hope speak to grief or discouragement?','What faithful work can you continue because your labor in the Lord matters?'],prayer:'Risen Jesus, hold those who grieve and strengthen all who serve. Let the hope of Your victory make me steadfast, loving, and full of courage. Amen.'}
];
const key='burningBushDailyWord.v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{read:[],last:0}}catch{state={read:[],last:0}};
// One shared UTC calendar date; plan anchor is explicit and remains stable across visitors.
const anchor=Date.UTC(2026,0,1),now=new Date(),utcToday=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()),weekNo=Math.max(1,Math.floor((utcToday-Date.UTC(2026,0,5))/604800000)+1),study=studies[(weekNo-1)%studies.length],dayNo=Math.max(1,Math.floor((utcToday-anchor)/86400000)+1),chapterNo=Math.min(dayNo,chapters.length),ci=chapterNo-1,entry=content[(dayNo-1)%content.length],chapter=chapters[ci];
document.getElementById('today').textContent=`${new Intl.DateTimeFormat('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(now)} · Day ${dayNo} of the global reading schedule (UTC)`;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saved(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function showScripture(){document.querySelector('#scripture').innerHTML=`<div class="label">Scripture of the Day · KJV</div><h2>${safe(entry.title)}</h2><p class="ref">${safe(entry.ref)}</p><blockquote class="verse">“${safe(entry.verse)}”<cite>— ${safe(entry.ref)} · King James Version</cite></blockquote><p class="note">A short daily reading selected to keep Scripture at the center of the day.</p>`}
function showDevotional(){document.querySelector('#devotional').innerHTML=`<div class="label">Devotional of the Day</div><h2>${safe(entry.title)}</h2><p class="ref">A practical reflection for Day ${dayNo}</p><p>${safe(entry.dev)}</p><h3>Pause and reflect</h3><div class="question">${safe(entry.dq)}</div><h3>A short prayer</h3><p class="prayer">${safe(entry.pr)}</p>`}
function showStudy(){const weekStart=new Date(Date.UTC(2026,0,5)+(weekNo-1)*604800000),weekEnd=new Date(weekStart.getTime()+6*86400000),fmt=d=>new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',timeZone:'UTC'}).format(d);document.querySelector('#study').innerHTML=`<div class="label">Weekly Bible Study · Week ${weekNo} · UTC</div><h2>${safe(study.title)}</h2><p class="ref">${safe(study.ref)} · ${fmt(weekStart)}–${fmt(weekEnd)}${weekStart.getUTCFullYear()!==weekEnd.getUTCFullYear()?`, ${weekStart.getUTCFullYear()}–${weekEnd.getUTCFullYear()}`:`, ${weekStart.getUTCFullYear()}`}</p><p class="note">A focused study for this week. The study changes automatically on Monday at 00:00 UTC and is the same for every visitor.</p><div class="rule"></div><h3>Read the passage</h3><p>Read the passage above in your King James Bible, then consider the questions below.</p><h3>Context</h3><p>${safe(study.context)}</p><h3>Discuss and reflect</h3><ol>${study.questions.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><h3>A closing prayer</h3><p class="prayer">${safe(study.prayer)}</p><p class="note">This first version rotates through four prepared weekly studies, then repeats the cycle. A new study library can be added as it is written and reviewed.</p>`}
function showChapter(){const done=state.read.includes(ci);const curated=ci<content.length;document.querySelector('#chapter').innerHTML=`<div class="label">One Chapter a Day · Reading ${chapterNo} of 1,189</div><h2>${safe(chapter)}</h2><p class="ref">${curated?safe(content[ci].title):'Continue the journey through Scripture'}</p><div class="notice">${curated?`<strong>Chapter guide:</strong> ${safe(content[ci].ex)}<h3>Three lessons</h3><ul>${content[ci].lessons.map(x=>`<li>${safe(x)}</li>`).join('')}</ul><h3>Reflect</h3><div class="question">${safe(content[ci].q)}</div>`:`<strong>Read today:</strong> ${safe(chapter)} in your KJV Bible. Your daily chapter follows the complete 1,189-chapter sequence, from Genesis 1 to Revelation 22. The reviewed chapter guides currently cover the first 30 readings; this later chapter is ready in the schedule and progress tracker while its editorial guide is prepared.`}</div><div class="rule"></div><div class="row"><button class="action" id="mark" ${done?'disabled':''}>${done?'✓ Chapter marked as read':'Mark as Read'}</button><span class="note">Your progress is saved on this browser only.</span></div>`;document.querySelector('#mark').addEventListener('click',()=>{if(!state.read.includes(ci))state.read.push(ci);state.last=ci;saved();renderProgress();showChapter()})}
function renderProgress(){const pct=(state.read.length/1189*100).toFixed(1),firstUnread=chapters.findIndex((_,i)=>!state.read.includes(i)),resume=firstUnread<0?1188:firstUnread;document.querySelector('#progress').innerHTML=`<div class="label">Your personal reading journey</div><h2>Every chapter counts</h2><div class="progress-head"><strong>${state.read.length} of 1,189 chapters read</strong><span class="note">${pct}% complete</span></div><div class="progress-track" role="progressbar" aria-valuenow="${state.read.length}" aria-valuemin="0" aria-valuemax="1189"><div class="progress-fill" style="width:${pct}%"></div></div><p class="note">Schedule today: Day ${dayNo} · ${safe(chapter)}. Your reading progress is independent of the shared daily schedule.</p><div class="row"><button class="action" id="resume">${state.read.length?(firstUnread<0?'Review Revelation 22':'Resume next unread chapter'):'Start with Genesis 1'}</button><label for="jump" class="note">Catch up or revisit:</label><select id="jump" class="select" aria-label="Choose a Bible chapter">${chapters.map((x,i)=>`<option value="${i}" ${i===resume?'selected':''}>${i+1}. ${safe(x)}${state.read.includes(i)?' ✓':''}</option>`).join('')}</select><button class="small-btn" id="openChapter">Open chapter</button></div><div class="rule"></div><h3>Recently completed</h3><div class="history">${state.read.length?[...state.read].sort((a,b)=>b-a).slice(0,20).map(i=>`<div class="chapter-row"><span>${i+1}. ${safe(chapters[i])}<small>${i<content.length?safe(content[i].title):'Chapter reading'}</small></span><button class="small-btn done" data-unread="${i}">Read ✓</button></div>`).join(''):'<p class="note">Your completed chapters will appear here on this device.</p>'}</div><p class="note">Progress is stored in this browser’s local storage. It does not sync between devices or identify visitors. Clearing browser data may erase it.</p>`;
document.querySelector('#resume').onclick=()=>open(chapters.length>resume?resume:1188);document.querySelector('#openChapter').onclick=()=>open(Number(document.querySelector('#jump').value));document.querySelectorAll('[data-unread]').forEach(b=>b.onclick=()=>{state.read=state.read.filter(i=>i!==Number(b.dataset.unread));saved();renderProgress();showChapter()})}
function open(i){if(i>=content.length&&i!==ci){/* scheduled guide remains available */}document.querySelector('[data-tab="chapter"]').click();document.querySelector('#chapter').scrollIntoView({behavior:'smooth',block:'start'});if(i!==ci){const cur=chapter;document.querySelector('#chapter h2').textContent=chapters[i];document.querySelector('#chapter .label').textContent=`One Chapter a Day · Reading ${i+1} of 1,189`;document.querySelector('#chapter .ref').textContent=i<content.length?content[i].title:'Catch-up reading';document.querySelector('#chapter .notice').innerHTML=i<content.length?`<strong>Chapter guide:</strong> ${safe(content[i].ex)}<h3>Three lessons</h3><ul>${content[i].lessons.map(x=>`<li>${safe(x)}</li>`).join('')}</ul><h3>Reflect</h3><div class="question">${safe(content[i].q)}</div>`:`<strong>Read:</strong> ${safe(chapters[i])} in your KJV Bible. The full sequential reading schedule includes all 1,189 chapters.`;const b=document.querySelector('#mark');b.disabled=state.read.includes(i);b.textContent=b.disabled?'✓ Chapter marked as read':'Mark as Read';b.onclick=()=>{if(!state.read.includes(i))state.read.push(i);state.last=i;saved();renderProgress();document.querySelector('#jump').value=i;open(i)};}}
showChapter();showStudy();renderProgress();document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===btn)));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('hidden',p.id!==btn.dataset.tab))}));
</script></body></html>
